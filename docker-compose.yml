version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: ecg_postgres
    environment:
      POSTGRES_DB: ecg_db
      POSTGRES_USER: ecg_user
      POSTGRES_PASSWORD: ecg_password
    ports:
      - "5433:5432"  # External 5433 to avoid conflict
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecg_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecg_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: ecg_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecg_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mosquitto MQTT Broker
  mqtt:
    image: eclipse-mosquitto:2
    container_name: ecg_mqtt
    ports:
      - "1884:1883"  # External 1884 to avoid conflict with user's existing broker
      - "9002:9001"  # External 9002 to avoid conflict
    volumes:
      - ./mqtt/config:/mosquitto/config
      - ./mqtt/data:/mosquitto/data
      - ./mqtt/log:/mosquitto/log
    networks:
      - ecg_network
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node-RED for data processing
  nodered:
    build:
      context: ./nodered
      dockerfile: Dockerfile
    container_name: ecg_nodered
    ports:
      - "1880:1880"
    environment:
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
    depends_on:
      mqtt:
        condition: service_healthy
    volumes:
      - ./nodered/flows.json:/data/flows.json
      - ./nodered/settings.js:/data/settings.js
      - nodered_data:/data
    networks:
      - ecg_network

  # Smartwatch Simulator
  simulator:
    build:
      context: .
      dockerfile: ./simulator/Dockerfile
    container_name: ecg_simulator
    environment:
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - PARTICIPANT=1           # Participant ID (1-10)
      - SESSION=1               # Session number (default: 1)
      - MAX_VIDEOS=1            # Max videos per participant (all 7 versions)
      # - RANDOM_PARTICIPANTS=1  # Uncomment to randomly select participants
    depends_on:
      mqtt:
        condition: service_healthy
    networks:
      - ecg_network
    restart: unless-stopped

  # API Gateway
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: ecg_gateway
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ecg_user:ecg_password@postgres:5432/ecg_db
      - REDIS_URL=redis://redis:6379/0
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - ECG_SERVICE_URL=http://ecg-service:8001
      - IOT_SERVICE_URL=http://iot-service:8002
      - NODE_RED_URL=http://nodered:1880
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    volumes:
      - ./gateway:/app
    networks:
      - ecg_network
    command: python manage.py runserver 0.0.0.0:8000

  # ECG Processing Service
  ecg-service:
    build:
      context: ./services/ecg_service
      dockerfile: Dockerfile
    container_name: ecg_service
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://ecg_user:ecg_password@postgres:5432/ecg_db
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/ecg_service:/app
    networks:
      - ecg_network
    command: python manage.py runserver 0.0.0.0:8001

  # IoT/MQTT Service
  iot-service:
    build:
      context: ./services/iot_service
      dockerfile: Dockerfile
    container_name: iot_service
    ports:
      - "8002:8002"
    environment:
      - POSTGRES_DB=ecg_db
      - POSTGRES_USER=ecg_user
      - POSTGRES_PASSWORD=ecg_password
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql://ecg_user:ecg_password@postgres:5432/ecg_db
      - REDIS_URL=redis://redis:6379/2
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - MQTT_TOPIC=smartwatch/data
      - RUN_MAIN=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    volumes:
      - ./services/iot_service:/app
    networks:
      - ecg_network
    command: python manage.py runserver 0.0.0.0:8002

  # ECG Analysis Service (MATLAB Translation)
  analysis-service:
    build:
      context: ./services/ecg_analysis_service
      dockerfile: Dockerfile
    container_name: ecg_analysis_service
    ports:
      - "8003:8003"
    environment:
      - POSTGRES_DB=ecg_db
      - POSTGRES_USER=ecg_user
      - POSTGRES_PASSWORD=ecg_password
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql://ecg_user:ecg_password@postgres:5432/ecg_db
      - REDIS_URL=redis://redis:6379/3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/ecg_analysis_service:/app
    networks:
      - ecg_network
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8003"

  # PointCloud Activation Service
  pointcloud-service:
    build:
      context: ./services/pointcloud_service
      dockerfile: Dockerfile
    container_name: pointcloud_activation_service
    ports:
      - "8004:8004"
    environment:
      - POSTGRES_DB=ecg_db
      - POSTGRES_USER=ecg_user
      - POSTGRES_PASSWORD=ecg_password
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql://ecg_user:ecg_password@postgres:5432/ecg_db
      - REDIS_URL=redis://redis:6379/4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/pointcloud_service:/app
      - pointcloud_media:/app/media
    networks:
      - ecg_network
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8004"

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecg_frontend
    ports:
      - "3001:80"  # Port 3000 is in use, using 3001 instead
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api/ecg/latest
      - REACT_APP_GATEWAY_URL=http://localhost:8000/api
    depends_on:
      - gateway
    networks:
      - ecg_network

  # Frontend VR (React - HoloLens optimized)
  frontend-vr:
    build:
      context: ./frontend-vr
      dockerfile: Dockerfile
    container_name: ecg_frontend_vr
    ports:
      - "3002:80"  # VR version on port 3002
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api/ecg/latest
      - REACT_APP_GATEWAY_URL=http://localhost:8000/api
    depends_on:
      - gateway
    networks:
      - ecg_network

networks:
  ecg_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  nodered_data:
  pointcloud_media:
